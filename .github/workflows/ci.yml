name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wikiware_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wikiware_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEV: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikiware_test
      WIKIWARE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wikiware_test
      CSRF_SECRET_KEY: ci-only-secret-for-isolated-test-runs
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      S3_ENDPOINT: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: pip check
      - name: Apply migrations to an empty PostgreSQL database
        run: alembic upgrade head
      - name: Run isolated HTTP, renderer, and PostgreSQL tests
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Retain test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Python correctness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Reject syntax errors and undefined names
        run: ruff check --isolated --select E9,F63,F7,F82 src alembic *.py
      - name: Lint maintained test suites
        run: ruff check --isolated src/tests/test_*.py src/tests/conftest.py

  frontend:
    name: Browser logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          for script in static/*.js; do node --check "$script"; done
      - name: Test editor and draft recovery
        run: node --test tests/*.test.cjs
